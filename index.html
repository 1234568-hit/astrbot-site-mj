<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>奶蛙：天空岛之旅</title>
<style>
:root{--ink:#19343a;--leaf:#3a7e65;--sun:#ffcf66;--paper:#f7f5e8;--water:#80c9d1}*{box-sizing:border-box}body{margin:0;background:#cce8d5;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;overflow:hidden}.shell{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:1280px;margin:auto;padding:12px;gap:10px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.brand .mark{font-size:36px;filter:drop-shadow(0 3px 0 #fff)}h1{font-size:18px;margin:0}.sub{font-size:12px;color:#45676a}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#fffdf3;border:1px solid #b5d6c0;border-radius:6px;padding:7px 10px;font-weight:700;font-size:13px}.stage{position:relative;min-height:0;border:3px solid #fffdf3;border-radius:8px;overflow:hidden;background:#82c8c1;box-shadow:0 8px 24px #43816c33}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#102b2c88;padding:20px}.panel{max-width:520px;width:min(100%,520px);background:var(--paper);border:3px solid #fff;border-radius:8px;padding:24px;box-shadow:0 14px 40px #102b2c66}.panel h2{margin:0 0 8px;font-size:24px}.panel p{line-height:1.6;margin:8px 0 16px}.btn{border:0;border-radius:6px;background:#e49b4d;color:#fff;font-weight:800;padding:12px 18px;font-size:15px;cursor:pointer;box-shadow:0 3px 0 #b86b37}.btn:hover{filter:brightness(1.06)}.hud{position:absolute;left:14px;top:14px;max-width:min(440px,calc(100% - 28px));background:#fffdf0eF;border:1px solid #bad6be;border-radius:6px;padding:10px 12px}.hud strong{display:block;font-size:14px;margin-bottom:3px}.hud span{font-size:13px;line-height:1.45}.tip{position:absolute;right:12px;bottom:12px;border-radius:5px;padding:7px 9px;background:#143a3bc9;color:#fff;font-size:12px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}.quest{font-weight:800;font-size:14px}.mobile{display:none;gap:5px}.mobile button{width:44px;height:40px;border:1px solid #b5d6c0;border-radius:6px;background:#fffdf3;font-size:18px}.footer{font-size:11px;color:#527276;text-align:right}@media(max-width:650px){.shell{padding:8px;gap:8px}.top{align-items:flex-start}.stats{max-width:55%}.pill{font-size:11px;padding:6px 7px}.brand .mark{font-size:30px}.sub{max-width:170px}.bottom{align-items:flex-end}.mobile{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px)}.mobile .up{grid-column:2}.mobile .left{grid-column:1;grid-row:2}.mobile .down{grid-column:2;grid-row:2}.mobile .right{grid-column:3;grid-row:2}.quest{max-width:52%;font-size:12px}.footer{display:none}.panel{padding:18px}.panel h2{font-size:21px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="mark">🐸</div><div><h1>奶蛙：天空岛之旅</h1><div class="sub">一段关于记忆、旅伴与星空的原创同人冒险</div></div></div><div class="stats"><div class="pill">✦ 星屑 <b id="stars">0</b>/5</div><div class="pill">🧭 <b id="area">绿野边境</b></div></div></header>
<section class="stage"><canvas id="game"></canvas><div class="hud"><strong id="chapter">序章 · 醒来的旅行者</strong><span id="dialog">方向键或 WASD 移动。靠近闪光的星屑，按 E 收集；找齐五枚，去北方的古门。</span></div><div class="tip">移动：WASD / 方向键　互动：E</div><div class="overlay" id="intro"><div class="panel"><h2>一只失忆奶蛙，醒在星落之地</h2><p>旅行奶蛙和伙伴奶狗误入提瓦特边境。记忆散落成五枚星屑，古老的天空之门正等待被重新点亮。</p><p>探索草地、湖岸与遗迹，和奶狗互相照应。集齐星屑，揭开“原神”的秘密。</p><button class="btn" id="start">开始旅行</button></div></div></section>
<footer class="bottom"><div class="quest" id="quest">目标：沿着小路寻找第一枚星屑</div><div class="mobile"><button class="up" data-key="ArrowUp">▲</button><button class="left" data-key="ArrowLeft">◀</button><button class="down" data-key="ArrowDown">▼</button><button class="right" data-key="ArrowRight">▶</button></div><div class="footer">原创网页原型 · 不隶属于任何官方游戏</div></footer></main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1;function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const map={w:1800,h:1300};const player={x:250,y:980,vx:0,vy:0};const dog={x:205,y:1018};const keys=new Set();let playing=false,stars=0,gate=false,last=0,toastTimer=0;
const pieces=[{x:430,y:880,got:false,label:'初醒的记忆'},{x:730,y:620,got:false,label:'风里的名字'},{x:1110,y:900,got:false,label:'奶狗的约定'},{x:1390,y:460,got:false,label:'星空的方向'},{x:960,y:290,got:false,label:'天空岛的回声'}];
const trees=[[120,200,1],[360,300,.8],[600,180,1.1],[900,260,.9],[1220,180,1],[1580,230,.9],[1700,550,1.1],[300,550,1.1],[570,1020,.9],[1330,1080,1.2],[1600,900,.8],[740,400,.65],[1050,560,.7],[430,740,.8],[1500,730,.85]];
const rocks=[[350,450,38],[850,720,46],[1240,600,32],[560,330,25],[1510,420,40],[760,1120,34]];const ponds=[{x:1020,y:780,rx:150,ry:100},{x:500,y:700,rx:90,ry:60},{x:1450,y:850,rx:100,ry:60}];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function world(){return {x:clamp(player.x-W/2,0,map.w-W),y:clamp(player.y-H/2,0,map.h-H)}}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function drawTree(x,y,s,cx,cy){let x1=x-cx,y1=y-cy;ctx.fillStyle='#765b3a';ctx.fillRect(x1-5*s,y1-3*s,10*s,32*s);ellipse(x1,y1-14*s,26*s,23*s,'#397a55');ellipse(x1-15*s,y1-4*s,17*s,15*s,'#4a9160');ellipse(x1+15*s,y1-2*s,17*s,15*s,'#34734e')}
function drawWorld(t){let cam=world();ctx.fillStyle='#91d0a1';ctx.fillRect(0,0,W,H);for(let y=-100;y<H+100;y+=120)for(let x=-100;x<W+100;x+=140){let wx=x+cam.x,wy=y+cam.y;let v=Math.sin(wx*.018+wy*.021);ellipse(x,y,45+(v+1)*8,24,'rgba(225,244,167,.16)')}ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#d6c392';ctx.lineWidth=78;ctx.beginPath();ctx.moveTo(250-cam.x,1000-cam.y);ctx.bezierCurveTo(460-cam.x,900-cam.y,410-cam.x,600-cam.y,700-cam.x,600-cam.y);ctx.bezierCurveTo(1020-cam.x,600-cam.y,900-cam.x,960-cam.y,1200-cam.x,900-cam.y);ctx.bezierCurveTo(1480-cam.x,840-cam.y,1310-cam.x,420-cam.y,1570-cam.x,330-cam.y);ctx.stroke();ctx.strokeStyle='#eadbb3';ctx.lineWidth=58;ctx.stroke();for(const p of ponds){ellipse(p.x-cam.x,p.y-cam.y,p.rx,p.ry,'#55b6c4');ellipse(p.x-cam.x-18,p.y-cam.y-10,p.rx*.72,p.ry*.56,'#75cbd1')}for(const r of rocks){ellipse(r[0]-cam.x,r[1]-cam.y,r[2],r[2]*.68,'#899a8d');ellipse(r[0]-cam.x-7,r[1]-cam.y-5,r[2]*.55,r[2]*.25,'#a8b5a0')}for(const tr of trees)drawTree(...tr,cam.x,cam.y);let gx=960-cam.x,gy=170-cam.y;ctx.fillStyle='#d7c68c';ctx.fillRect(gx-92,gy+30,184,24);ctx.strokeStyle='#f5e6ac';ctx.lineWidth=16;ctx.beginPath();ctx.arc(gx,gy+30,75,Math.PI,0);ctx.stroke();ctx.fillStyle=gate?'#ffe67d':'#648998';ctx.fillRect(gx-53,gy+16,106,38);ellipse(gx,gy+31,28,22,gate?'#fff3a0':'#516e7a');ctx.fillStyle='#254851';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('古老的天空之门',gx,gy+86);for(let i=0;i<pieces.length;i++){let p=pieces[i];if(p.got)continue;let pulse=1+Math.sin(t/280+i)*.15;ellipse(p.x-cam.x,p.y-cam.y,16*pulse,16*pulse,'rgba(255,226,111,.26)');ellipse(p.x-cam.x,p.y-cam.y,7*pulse,7*pulse,'#fff3a0');ctx.fillStyle='#fff8d1';ctx.font='16px serif';ctx.fillText('✦',p.x-cam.x,p.y-cam.y-13)}let dx=dog.x-cam.x,dy=dog.y-cam.y;ellipse(dx,dy+11,17,7,'#52845755');ellipse(dx,dy,15,12,'#f3d49a');ellipse(dx-2,dy-3,11,9,'#fff0c6');ellipse(dx-12,dy-6,5,8,'#bf8959');ellipse(dx+12,dy-6,5,8,'#bf8959');ellipse(dx-5,dy-4,1.5,2,'#29383a');ellipse(dx+3,dy-4,1.5,2,'#29383a');ellipse(dx,dy,2.5,2,'#584138');let px=player.x-cam.x,py=player.y-cam.y;ellipse(px,py+15,21,8,'#52745755');ellipse(px,py,19,17,'#f3d348');ellipse(px-10,py-4,4,7,'#71bd80');ellipse(px+10,py-4,4,7,'#71bd80');ellipse(px-6,py-2,2.5,3,'#183b38');ellipse(px+6,py-2,2.5,3,'#183b38');ctx.strokeStyle='#8b573c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py+3,5,.25,Math.PI-.25);ctx.stroke();ctx.fillStyle='rgba(60,108,84,.08)';ctx.fillRect(0,0,W,H)}
function setDialog(title,text){document.getElementById('chapter').textContent=title;document.getElementById('dialog').textContent=text;toastTimer=3200}
function interact(){if(!playing)return;let nearest=null,dist=1e9;pieces.forEach(p=>{if(p.got)return;let d=Math.hypot(player.x-p.x,player.y-p.y);if(d<dist){dist=d;nearest=p}});if(nearest&&dist<78){nearest.got=true;stars++;document.getElementById('stars').textContent=stars;setDialog('记忆星屑 · '+nearest.label,stars===5?'五枚记忆重归一处。快去北方的古门！':'一段记忆回来了。奶狗摇着尾巴，像是在说：继续走吧。');document.getElementById('quest').textContent=stars===5?'目标：前往地图北方的天空之门':'目标：寻找散落的记忆星屑（'+stars+'/5）';return}let dg=Math.hypot(player.x-dog.x,player.y-dog.y);if(dg<75){setDialog('伙伴 · 奶狗','奶狗：汪！不记得过去也没关系，我们可以一起创造新的回忆。');return}if(Math.hypot(player.x-960,player.y-205)<150){if(stars===5){gate=true;document.getElementById('quest').textContent='目标完成：登上天空岛';document.getElementById('chapter').textContent='终章 · 天空岛的答案';document.getElementById('dialog').textContent='门扉在星光中开启。天空岛并非终点，而是所有旅人共享的一片天空。奶蛙终于想起：真正的“原神”，是每个仍愿意出发的灵魂。奶狗：汪！那我们下一站去哪？'}else setDialog('古老的天空之门','门扉沉睡着。还差 '+(5-stars)+' 枚记忆星屑才能开启。');return}setDialog('旅行笔记','靠近发光的星屑或奶狗，按 E 互动。')}
function update(dt){if(!playing)return;let ax=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);let ay=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);let l=Math.hypot(ax,ay)||1;player.x=clamp(player.x+ax/l*220*dt,30,map.w-30);player.y=clamp(player.y+ay/l*220*dt,30,map.h-30);let d=Math.hypot(dog.x-player.x,dog.y-player.y);if(d>54){dog.x+=(player.x-dog.x)/d*Math.min(d-48,175*dt);dog.y+=(player.y-dog.y)/d*Math.min(d-48,175*dt)}let a=player.x>1450&&player.y<550?'浮光高地':player.x<650&&player.y>700?'绿野边境':player.y<550?'星落遗迹':'风语湖畔';document.getElementById('area').textContent=a}
function loop(ts){let dt=Math.min((ts-last)/1000||0,.04);last=ts;update(dt);drawWorld(ts);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('keydown',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();keys.add(k);if(k==='e')interact()});addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));document.querySelectorAll('.mobile button').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys.delete(k)))});document.getElementById('start').onclick=()=>{playing=true;document.getElementById('intro').style.display='none';setDialog('序章 · 醒来的旅行者','奶蛙：我是谁并不重要……先找到记忆，再和奶狗一起去天空岛！')};
</script></body></html>
